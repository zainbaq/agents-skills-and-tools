name: Lint skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint pod skills
        run: python scripts/lint_skills.py
      - name: Compile pod scripts
        run: python -m compileall -q plugins scripts
